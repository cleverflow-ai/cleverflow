version: "3.5"

services:
  nats:
    image: nats:2.10.25
    ports:
      - "4222:4222" # Client connections
      - "6222:6222" # Cluster connections
      - "8222:8222" # HTTP monitoring
      - "8080:8080" # WebSocket connections
    volumes:
      - "./nats-server.conf:/etc/nats-server.conf"
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --http_port 8222 --auth 76de3ba222bec3af21f9dbfb01f3197b --config /etc/nats-server.conf"
    networks: [ "nats" ]

networks:
  nats:
    name: nats
